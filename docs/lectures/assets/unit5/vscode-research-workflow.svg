<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">VS Code research workflow</title>
  <desc id="desc">A VS Code workspace contains the file explorer, editor, terminal, and source control view. Source control records commits in the local Git repository, which exchanges commits with GitHub through push and pull.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245A81"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E4D2B"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
      .heading { font-size: 26px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
    </style>
  </defs>

  <rect x="35" y="35" width="760" height="410" rx="22" fill="#F7F8F7" stroke="#1E4D2B" stroke-width="4"/>
  <text x="415" y="75" text-anchor="middle" class="heading">VS Code workspace</text>

  <rect x="70" y="105" width="210" height="125" rx="14" fill="#E7EFEA" stroke="#1E4D2B" stroke-width="2.5"/>
  <text x="175" y="145" text-anchor="middle" class="label">Explorer</text>
  <text x="175" y="178" text-anchor="middle" class="body">Project files</text>
  <text x="175" y="205" text-anchor="middle" class="small">folders and status</text>

  <rect x="310" y="105" width="210" height="125" rx="14" fill="#EEF4F8" stroke="#245A81" stroke-width="2.5"/>
  <text x="415" y="145" text-anchor="middle" class="label">Editor</text>
  <text x="415" y="178" text-anchor="middle" class="body">R, QMD, LaTeX</text>
  <text x="415" y="205" text-anchor="middle" class="small">write and review</text>

  <rect x="550" y="105" width="210" height="125" rx="14" fill="#F6F1E7" stroke="#8B6B23" stroke-width="2.5"/>
  <text x="655" y="145" text-anchor="middle" class="label">Terminal</text>
  <text x="655" y="178" text-anchor="middle" class="body">Run the project</text>
  <text x="655" y="205" text-anchor="middle" class="small">R, Quarto, Git</text>

  <rect x="190" y="260" width="450" height="95" rx="14" fill="#EEF4F8" stroke="#245A81" stroke-width="2.5"/>
  <text x="415" y="298" text-anchor="middle" class="label">Source Control</text>
  <text x="415" y="330" text-anchor="middle" class="body">Inspect diffs, stage files, write commits</text>

  <line x1="175" y1="230" x2="315" y2="260" stroke="#245A81" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="415" y1="230" x2="415" y2="260" stroke="#245A81" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="655" y1="230" x2="515" y2="260" stroke="#245A81" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="190" y="382" width="450" height="48" rx="22" fill="#DCE9E0" stroke="#1E4D2B" stroke-width="2.5"/>
  <text x="415" y="414" text-anchor="middle" class="label">Local Git repository, branches and commits</text>
  <line x1="415" y1="355" x2="415" y2="380" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="885" y="150" width="280" height="190" rx="20" fill="#EEF4F8" stroke="#245A81" stroke-width="4"/>
  <text x="1025" y="202" text-anchor="middle" class="heading">GitHub</text>
  <text x="1025" y="240" text-anchor="middle" class="body">Remote repository</text>
  <text x="1025" y="275" text-anchor="middle" class="body">Shared commits</text>
  <text x="1025" y="310" text-anchor="middle" class="body">Pull requests and review</text>

  <line x1="640" y1="405" x2="880" y2="300" stroke="#245A81" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="760" y="330" text-anchor="middle" class="label" fill="#245A81">push</text>
  <line x1="885" y1="215" x2="645" y2="390" stroke="#1E4D2B" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="770" y="240" text-anchor="middle" class="label" fill="#1E4D2B">pull</text>
</svg>
