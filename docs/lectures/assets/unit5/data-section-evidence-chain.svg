<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Evidence chain for a data section</title>
  <desc id="desc">The conceptual hypothesis determines data requirements, the analytic sample, variable construction, descriptive evidence, and the boundaries of the empirical claim. Repository artifacts support each step.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E4D2B"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 17px; }
      .repo { font-size: 18px; font-weight: 700; fill: #245A81; }
    </style>
  </defs>

  <g>
    <rect x="25" y="70" width="170" height="105" rx="16" fill="#E7EFEA" stroke="#1E4D2B" stroke-width="3"/>
    <text x="110" y="110" text-anchor="middle" class="heading">Hypothesis</text>
    <text x="110" y="142" text-anchor="middle" class="body">What must the</text>
    <text x="110" y="165" text-anchor="middle" class="body">data distinguish?</text>

    <rect x="220" y="70" width="170" height="105" rx="16" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
    <text x="305" y="105" text-anchor="middle" class="heading">Requirements</text>
    <text x="305" y="137" text-anchor="middle" class="body">Population, period</text>
    <text x="305" y="160" text-anchor="middle" class="body">unit, variation</text>

    <rect x="415" y="70" width="170" height="105" rx="16" fill="#F6F1E7" stroke="#8B6B23" stroke-width="3"/>
    <text x="500" y="110" text-anchor="middle" class="heading">Sample</text>
    <text x="500" y="142" text-anchor="middle" class="body">Selection, loss</text>
    <text x="500" y="165" text-anchor="middle" class="body">and coverage</text>

    <rect x="610" y="70" width="170" height="105" rx="16" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
    <text x="695" y="110" text-anchor="middle" class="heading">Measures</text>
    <text x="695" y="142" text-anchor="middle" class="body">Construction</text>
    <text x="695" y="165" text-anchor="middle" class="body">and proxies</text>

    <rect x="805" y="70" width="170" height="105" rx="16" fill="#E7EFEA" stroke="#1E4D2B" stroke-width="3"/>
    <text x="890" y="110" text-anchor="middle" class="heading">Descriptives</text>
    <text x="890" y="142" text-anchor="middle" class="body">Scale, variation</text>
    <text x="890" y="165" text-anchor="middle" class="body">and anomalies</text>

    <rect x="1000" y="70" width="175" height="105" rx="16" fill="#F6F1E7" stroke="#8B6B23" stroke-width="3"/>
    <text x="1087" y="110" text-anchor="middle" class="heading">Boundaries</text>
    <text x="1087" y="142" text-anchor="middle" class="body">Interpretation</text>
    <text x="1087" y="165" text-anchor="middle" class="body">and limitations</text>

    <line x1="195" y1="122" x2="217" y2="122" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="390" y1="122" x2="412" y2="122" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="585" y1="122" x2="607" y2="122" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="780" y1="122" x2="802" y2="122" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="975" y1="122" x2="997" y2="122" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <text x="600" y="235" text-anchor="middle" class="heading">Repository evidence</text>

  <rect x="95" y="275" width="215" height="95" rx="15" fill="#F4F7FA" stroke="#245A81" stroke-width="2.5"/>
  <text x="202" y="313" text-anchor="middle" class="repo">README</text>
  <text x="202" y="343" text-anchor="middle" class="body">provenance and access</text>

  <rect x="345" y="275" width="215" height="95" rx="15" fill="#F4F7FA" stroke="#245A81" stroke-width="2.5"/>
  <text x="452" y="313" text-anchor="middle" class="repo">Build scripts</text>
  <text x="452" y="343" text-anchor="middle" class="body">sample construction</text>

  <rect x="595" y="275" width="215" height="95" rx="15" fill="#F4F7FA" stroke="#245A81" stroke-width="2.5"/>
  <text x="702" y="313" text-anchor="middle" class="repo">Variable documentation</text>
  <text x="702" y="343" text-anchor="middle" class="body">definitions and units</text>

  <rect x="845" y="275" width="260" height="95" rx="15" fill="#F4F7FA" stroke="#245A81" stroke-width="2.5"/>
  <text x="975" y="313" text-anchor="middle" class="repo">Tables and figures</text>
  <text x="975" y="343" text-anchor="middle" class="body">descriptive evidence</text>

  <line x1="500" y1="175" x2="455" y2="270" stroke="#8B6B23" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="695" y1="175" x2="700" y2="270" stroke="#8B6B23" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="890" y1="175" x2="970" y2="270" stroke="#8B6B23" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="175" x2="205" y2="270" stroke="#8B6B23" stroke-width="2.5" marker-end="url(#arrow)"/>

</svg>
