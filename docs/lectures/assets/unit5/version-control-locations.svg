<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Three locations in a version-controlled research workflow</title>
  <desc id="desc">Working files and local Git history are on the researcher's computer. GitHub hosts a remote copy. Stage and commit move changes into local history. Push and pull synchronize local and remote history.</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E4D2B"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245A81"/>
    </marker>
  </defs>
  <rect x="25" y="28" width="750" height="330" rx="22" fill="#F3F7F4" stroke="#1E4D2B" stroke-width="3"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1E4D2B">Your computer</text>
  <rect x="70" y="105" width="285" height="175" rx="18" fill="#FFFFFF" stroke="#1E4D2B" stroke-width="3"/>
  <text x="212" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1E4D2B">Working files</text>
  <text x="212" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#25352B">Files you edit</text>
  <text x="212" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#25352B">in RStudio</text>
  <rect x="440" y="105" width="285" height="175" rx="18" fill="#FFFFFF" stroke="#1E4D2B" stroke-width="3"/>
  <text x="582" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1E4D2B">Local Git history</text>
  <text x="582" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#25352B">Commits stored</text>
  <text x="582" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#25352B">on your computer</text>
  <line x1="355" y1="170" x2="430" y2="170" stroke="#1E4D2B" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="393" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1E4D2B">stage</text>
  <text x="393" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1E4D2B">commit</text>
  <rect x="165" y="305" width="470" height="38" rx="19" fill="#DCE8DF"/>
  <text x="400" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1E4D2B">RStudio: editor and Git interface</text>
  <rect x="865" y="105" width="285" height="175" rx="18" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
  <text x="1007" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#245A81">GitHub remote</text>
  <text x="1007" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#25352B">Repository hosted</text>
  <text x="1007" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#25352B">online</text>
  <line x1="725" y1="155" x2="855" y2="155" stroke="#245A81" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="790" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#245A81">push</text>
  <line x1="855" y1="230" x2="735" y2="230" stroke="#245A81" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="795" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#245A81">pull</text>
</svg>
