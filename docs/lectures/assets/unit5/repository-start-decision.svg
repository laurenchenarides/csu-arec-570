<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Decision tree for starting a Git project</title>
  <desc id="desc">A new project is initialized locally and connected to a new GitHub repository. An existing repository is cloned directly with write access. Without write access, it is cloned for local use or forked and then cloned when commits need to be stored on GitHub.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E4D2B"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>

  <g font-family="Arial, sans-serif" fill="#25352B">
    <rect x="450" y="10" width="300" height="58" rx="18" fill="#DCE8DF" stroke="#1E4D2B" stroke-width="3"/>
    <text x="600" y="47" text-anchor="middle" font-size="24" font-weight="700">How does the project begin?</text>

    <line x1="520" y1="68" x2="270" y2="112" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="680" y1="68" x2="900" y2="112" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="90" y="115" width="300" height="62" rx="16" fill="#F3F7F4" stroke="#1E4D2B" stroke-width="3"/>
    <text x="240" y="154" text-anchor="middle" font-size="23" font-weight="700">New project</text>

    <rect x="790" y="115" width="320" height="62" rx="16" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
    <text x="950" y="154" text-anchor="middle" font-size="23" font-weight="700">Existing GitHub repository</text>

    <line x1="240" y1="177" x2="240" y2="215" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="90" y="218" width="300" height="62" rx="16" fill="#F3F7F4" stroke="#1E4D2B" stroke-width="3"/>
    <text x="240" y="257" text-anchor="middle" font-size="22" font-weight="700">Initialize Git locally</text>

    <line x1="240" y1="280" x2="240" y2="318" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="70" y="321" width="340" height="100" rx="16" fill="#F3F7F4" stroke="#1E4D2B" stroke-width="3"/>
    <text x="240" y="356" text-anchor="middle" font-size="21" font-weight="700">Create a GitHub repository</text>
    <text x="240" y="386" text-anchor="middle" font-size="19">Push commits there</text>
    <text x="240" y="412" text-anchor="middle" font-size="18" fill="#1E4D2B">origin = your new repository</text>

    <line x1="950" y1="177" x2="950" y2="215" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="790" y="218" width="320" height="62" rx="16" fill="#F7F4EC" stroke="#8B6F31" stroke-width="3"/>
    <text x="950" y="257" text-anchor="middle" font-size="22" font-weight="700">Write access to the original?</text>

    <line x1="1030" y1="280" x2="1080" y2="325" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1065" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#1E4D2B">Yes</text>
    <rect x="920" y="330" width="260" height="118" rx="16" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
    <text x="1050" y="365" text-anchor="middle" font-size="21" font-weight="700">Clone the original</text>
    <text x="1050" y="394" text-anchor="middle" font-size="18">Push branches there</text>
    <text x="1050" y="424" text-anchor="middle" font-size="17" fill="#245A81">origin = original or shared repo</text>

    <line x1="870" y1="280" x2="730" y2="325" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="820" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#1E4D2B">No</text>
    <rect x="555" y="330" width="310" height="62" rx="16" fill="#F7F4EC" stroke="#8B6F31" stroke-width="3"/>
    <text x="710" y="369" text-anchor="middle" font-size="21" font-weight="700">Store your commits on GitHub?</text>

    <line x1="645" y1="392" x2="535" y2="437" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="585" y="414" text-anchor="middle" font-size="18" font-weight="700" fill="#1E4D2B">No</text>
    <rect x="390" y="442" width="270" height="105" rx="16" fill="#F1F3F2" stroke="#69736D" stroke-width="3"/>
    <text x="525" y="476" text-anchor="middle" font-size="21" font-weight="700">Clone the original</text>
    <text x="525" y="505" text-anchor="middle" font-size="18">Keep commits locally</text>
    <text x="525" y="532" text-anchor="middle" font-size="17" fill="#4D5651">Pull original updates</text>

    <line x1="775" y1="392" x2="805" y2="437" stroke="#1E4D2B" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="806" y="414" text-anchor="middle" font-size="18" font-weight="700" fill="#1E4D2B">Yes</text>
    <rect x="690" y="442" width="270" height="105" rx="16" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
    <text x="825" y="474" text-anchor="middle" font-size="21" font-weight="700">Fork, then clone</text>
    <text x="825" y="503" text-anchor="middle" font-size="18">Push branches to your fork</text>
    <text x="825" y="530" text-anchor="middle" font-size="17" fill="#245A81">Open a pull request to contribute</text>
  </g>
</svg>
