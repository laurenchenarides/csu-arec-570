<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Two ways the effect of military service on earnings can be identified</title>
  <desc id="desc">Two directed acyclic graphs. Panel A: observed characteristics (age, schooling, test scores) point to both military service and earnings; if they are the only common cause, comparing veterans and nonveterans with the same characteristics identifies the effect. Panel B: the draft lottery number points to military service only; earnings potential, not observed, points to service and earnings but not to the lottery, so the lottery identifies the effect for men whose service it changes.</desc>
  <defs>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E4D2B"/>
    </marker>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245A81"/>
    </marker>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9A3324"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
      .title { font-size: 21px; font-weight: 700; }
      .node { font-size: 19px; font-weight: 700; }
      .note { font-size: 16px; font-style: italic; fill: #555; }
      .req { font-size: 17px; fill: #222; }
    </style>
  </defs>

  <line x1="600" y1="20" x2="600" y2="420" stroke="#C9D3CC" stroke-width="2"/>

  <!-- Panel A -->
  <text x="300" y="32" text-anchor="middle" class="title">A. Measure what determines service</text>
  <rect x="135" y="60" width="330" height="80" rx="14" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
  <text x="300" y="97" text-anchor="middle" class="node">Age, schooling, test scores (X)</text>
  <text x="300" y="124" text-anchor="middle" class="note">observed</text>
  <rect x="30" y="270" width="230" height="80" rx="14" fill="#E7EFEA" stroke="#1E4D2B" stroke-width="3"/>
  <text x="145" y="317" text-anchor="middle" class="node">Military service (D)</text>
  <rect x="345" y="270" width="230" height="80" rx="14" fill="#E7EFEA" stroke="#1E4D2B" stroke-width="3"/>
  <text x="460" y="317" text-anchor="middle" class="node">Earnings (Y)</text>
  <line x1="240" y1="140" x2="170" y2="263" stroke="#245A81" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="360" y1="140" x2="430" y2="263" stroke="#245A81" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="260" y1="310" x2="337" y2="310" stroke="#1E4D2B" stroke-width="4" marker-end="url(#aG)"/>
  <text x="300" y="395" text-anchor="middle" class="req">Requires: X is the only factor that affects</text>
  <text x="300" y="418" text-anchor="middle" class="req">both service and earnings</text>

  <!-- Panel B -->
  <text x="900" y="32" text-anchor="middle" class="title">B. Use variation U does not drive</text>
  <rect x="870" y="60" width="310" height="80" rx="14" fill="#FFFFFF" stroke="#9A3324" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="1025" y="97" text-anchor="middle" class="node">Earnings potential (U)</text>
  <text x="1025" y="124" text-anchor="middle" class="note">not observed: part of the error term</text>
  <rect x="615" y="270" width="150" height="80" rx="14" fill="#EEF4F8" stroke="#245A81" stroke-width="3"/>
  <text x="690" y="304" text-anchor="middle" class="node">Draft lottery</text>
  <text x="690" y="330" text-anchor="middle" class="node">number (Z)</text>
  <rect x="815" y="270" width="160" height="80" rx="14" fill="#E7EFEA" stroke="#1E4D2B" stroke-width="3"/>
  <text x="895" y="304" text-anchor="middle" class="node">Military</text>
  <text x="895" y="330" text-anchor="middle" class="node">service (D)</text>
  <rect x="1025" y="270" width="160" height="80" rx="14" fill="#E7EFEA" stroke="#1E4D2B" stroke-width="3"/>
  <text x="1105" y="317" text-anchor="middle" class="node">Earnings (Y)</text>
  <line x1="765" y1="310" x2="807" y2="310" stroke="#245A81" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="975" y1="310" x2="1017" y2="310" stroke="#1E4D2B" stroke-width="4" marker-end="url(#aG)"/>
  <line x1="960" y1="140" x2="915" y2="263" stroke="#9A3324" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#aR)"/>
  <line x1="1090" y1="140" x2="1100" y2="263" stroke="#9A3324" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#aR)"/>
  <text x="900" y="395" text-anchor="middle" class="req">Requires: the lottery affects earnings only</text>
  <text x="900" y="418" text-anchor="middle" class="req">through service, and U does not affect it</text>
</svg>
